
---
- name: Verify target operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "22.04"
    fail_msg: "This deployment requires Ubuntu 22.04."
    success_msg: "Target is Ubuntu 22.04."

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /opt/dataproc
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create dataproc service group
  ansible.builtin.group:
    name: dataproc
    gid: 2048
    system: true
    state: present

- name: Create dataproc service account
  ansible.builtin.user:
    name: dataproc
    uid: 2048
    group: dataproc
    home: /nonexistent
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present

- name: Install packages required for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's official APT signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's official APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
