---
- name: Verify target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["distribution_version"] == "22.04"
    fail_msg: "This deployment requires Ubuntu 22.04."
    success_msg: "Target is Ubuntu 22.04."

- name: Ensure application directory exists
  ansible.builtin.file:
    path: /opt/dataproc
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create dataproc service group
  ansible.builtin.group:
    name: dataproc
    gid: 2048
    system: true
    state: present

- name: Create dataproc service account
  ansible.builtin.user:
    name: dataproc
    uid: 2048
    group: dataproc
    home: /nonexistent
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present

- name: Install packages required for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker official APT signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker APT repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_arch
  changed_when: false

- name: Add Docker official APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch.stdout }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Copy application source files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/"
    dest: /opt/dataproc/app/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Set executable permissions on entrypoint
  ansible.builtin.file:
    path: /opt/dataproc/app/entrypoint.sh
    owner: root
    group: root
    mode: "0755"

- name: Install Docker Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/dataproc/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Install Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/dataproc/nginx.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure host Nginx log directory exists
  ansible.builtin.file:
    path: /var/log/nginx
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Prepare Nginx access log for container writes
  ansible.builtin.file:
    path: /var/log/nginx/custom-access.log
    state: touch
    owner: root
    group: "101"
    mode: "0664"

- name: Install dataproc systemd unit
  ansible.builtin.template:
    src: dataproc.service.j2
    dest: /etc/systemd/system/dataproc.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH so remote administration remains available
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow application traffic on port 8080
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable and start dataproc service
  ansible.builtin.systemd:
    name: dataproc.service
    enabled: true
    state: started
    daemon_reload: true
